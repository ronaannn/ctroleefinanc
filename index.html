<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinançasPro - Controlo Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Ecrã de Login -->
    <div id="loginScreen" class="flex-1 flex flex-col items-center justify-center bg-gray-900 z-50 fixed inset-0">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl text-center max-w-sm w-full">
            <div class="bg-blue-600 w-16 h-16 rounded-xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <i class="fas fa-wallet text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">FinançasPro</h1>
            <p class="text-gray-400 mb-8 text-sm">Aceda para sincronizar os seus dados na nuvem.</p>
            <button id="btnLogin" class="w-full bg-white text-gray-900 font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-3 hover:bg-gray-100 transition-colors">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                Entrar com o Google
            </button>
        </div>
    </div>

    <!-- Aplicação Principal (Oculta até fazer login) -->
    <div id="appScreen" class="hidden flex-1 flex-col">
        <!-- Cabeçalho -->
        <header class="bg-gray-800 border-b border-gray-700 py-4 px-6 sticky top-0 z-40">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 w-10 h-10 rounded-lg flex items-center justify-center">
                        <i class="fas fa-wallet text-white"></i>
                    </div>
                    <h1 class="text-xl font-bold">FinançasPro</h1>
                </div>
                <div class="flex items-center gap-4">
                    <span id="userName" class="text-sm font-medium text-gray-300"></span>
                    <button id="btnSair" class="text-gray-400 hover:text-white text-sm"><i class="fas fa-sign-out-alt"></i> Sair</button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto w-full p-6 flex-1 flex flex-col gap-6">
            <!-- Navegação de Abas -->
            <div class="flex bg-gray-800 rounded-lg p-1 w-fit">
                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-6 py-2 rounded-md bg-blue-600 text-white font-medium transition-all">Visão Geral</button>
                <button onclick="switchTab('transactions')" id="tab-transactions" class="px-6 py-2 rounded-md text-gray-400 hover:text-white font-medium transition-all">Transações</button>
            </div>

            <!-- Aba: Visão
